<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--ink);
        color: var(--paper);
        margin: 0;
      }
      .og {
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .og h1 {
        font-size: 72px;
        max-width: 14ch;
        margin: 0;
      }
      .og p {
        font-size: 22px;
        margin: 0;
        opacity: 0.72;
      }
    </style>
  </head>
  <body>
    <div class="og">
      <p>AI CMO · Anthony Philippo</p>
      <div>
        <h1>Un marketing complet qui tourne <em>sans vous</em>.</h1>
        <hr class="hero-rule" />
      </div>
      <p>Direction marketing fractionnée · Liège</p>
    </div>
  </body>
</html>
